# One block per channel. channel_id is filled in after the OAuth connect.
channels:
  - key: "CHANNEL_001"
    channel_name: "My First Channel"
    channel_id: ""                 # UCxxxxxxxx (fill in after connecting)
    drive_folder_id: "PASTE_DRIVE_FOLDER_ID"
    timezone: "Asia/Kolkata"
    enabled: true
    defaults:
      privacy: "private"
      category_id: "22"
      tags: ["YouTube", "Video"]
      description_footer: "Please subscribe!"
      language: "English"          # Gemini metadata language: English (default) | Hindi | Hinglish
