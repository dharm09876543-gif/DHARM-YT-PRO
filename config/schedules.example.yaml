scheduler:
  enabled: true
  timezone: "Asia/Kolkata"
  slots: ["09:00", "13:00", "17:00", "21:00"]
  lead_minutes: 60               # a slot must be at least this many minutes ahead
  days_ahead: 30                 # how many days ahead to look for slots
  # channel-specific override
  overrides:
    CHANNEL_001:
      slots: ["10:00", "18:00"]
