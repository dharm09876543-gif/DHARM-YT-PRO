name: Upload videos
# Planner job lists enabled + connected channels; then one matrix job per channel runs
# `python main.py run --channel UC...`. A channel with a vpn_profile uploads through its own
# WireGuard tunnel (config from the secret WG_CONF_<PROFILE>, e.g. WG_CONF_CH01).
# GitHub limits a matrix to 256 jobs; with more channels the planner rotates a 256-channel window.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "How many channel jobs run at the same time"
        required: false
        default: "4"
permissions:
  contents: read
concurrency:
  group: dharm-yt-uploads
  cancel-in-progress: false
env:
  APP_ENV: production
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
    outputs:
      channels: ${{ steps.matrix.outputs.channels }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Secrets check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=DATABASE_URL missing::DATABASE_URL secret is not set. Add the PostgreSQL URL (postgresql://USER:PASS@HOST:5432/dharm_yt) under Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$TOKEN_ENCRYPTION_KEY" ]; then
            echo "::error title=TOKEN_ENCRYPTION_KEY missing::TOKEN_ENCRYPTION_KEY secret is not set (generate it with python main.py keygen and use the same value as your local .env)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build channel matrix
        id: matrix
        run: |
          python scripts/actions_helper.py matrix --max 256 --offset "${{ github.run_number }}" --out matrix.json
          echo "channels=$(python -c 'import json;print(json.dumps(json.load(open("matrix.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(json.load(open("matrix.json"))["count"])')" >> "$GITHUB_OUTPUT"

  upload:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.UPLOAD_MAX_PARALLEL || '4') }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.channels) }}
    # One channel never runs twice at the same time (also across overlapping workflow runs).
    concurrency:
      group: dharm-yt-upload-${{ matrix.channel_id }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install WireGuard tools
        if: matrix.vpn_profile != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools openresolv
      - name: Load this channel's WireGuard config (masked, never echoed)
        if: matrix.vpn_profile != ''
        env:
          # Only this channel's WG_CONF_<PROFILE> secret (dumping every secret makes GitHub hold the run
          # as action_required, so it must never be used).
          WG_CONF_VALUE: ${{ secrets[matrix.wg_secret] }}
        run: python scripts/actions_helper.py select-wg --profile "${{ matrix.vpn_profile }}"
      - name: Upload videos (${{ matrix.channel_id }})
        run: python main.py run --channel "${{ matrix.channel_id }}"
      - name: Make sure the tunnel is down
        if: always() && matrix.vpn_profile != ''
        run: |
          for i in $(sudo wg show interfaces 2>/dev/null); do sudo ip link delete dev "$i" || true; done
          sudo rm -rf /tmp/dy-wg-* || true

  status:
    # Public dashboard snapshot (counts only). Force-pushed to the 'status' branch as one commit,
    # so main stays clean and history never grows. Safe-checked before writing.
    needs: [plan, upload]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: dashboard-status
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build snapshot
        run: python main.py status-export --out "$RUNNER_TEMP/status.json" --run-status "${{ needs.upload.result == 'failure' && 'failed' || 'success' }}"
      - name: Publish to status branch
        run: |
          mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q -b status
          cp "$RUNNER_TEMP/status.json" status.json
          git add status.json
          git -c user.name=dharm-yt-bot -c user.email=actions@users.noreply.github.com commit -qm "dashboard status snapshot"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
