name: Drive cleanup
on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dharm-yt-uploads
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_ENV: production
    steps:
      - name: Secrets check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=DATABASE_URL missing::DATABASE_URL secret is not set. Add the PostgreSQL URL (postgresql://USER:PASS@HOST:5432/dharm_yt) under Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$TOKEN_ENCRYPTION_KEY" ]; then
            echo "::error title=TOKEN_ENCRYPTION_KEY missing::TOKEN_ENCRYPTION_KEY secret is not set (generate it with python main.py keygen and use the same value as your local .env)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Drive cleanup
        run: python main.py cleanup
